<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070A" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2305070A'/%3E%3Cpath d='M36 7 17 35h13l-2 22 20-31H35z' fill='%232B8EF0'/%3E%3C/svg%3E" />
    <link rel="canonical" href="https://ma-comunication.vercel.app/" />
    <meta property="og:site_name" content="MA Communication" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
    <script>
      (function () {
        try {
          var isAdmin = window.location.pathname.indexOf('/admin') === 0;
          var key = isAdmin ? 'ma-theme-admin' : 'ma-theme';
          var stored = localStorage.getItem(key);
          var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : (prefersLight ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
